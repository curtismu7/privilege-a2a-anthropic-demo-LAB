# Local standalone compose: one image, three processes (main agent, worker agent, MCP server),
# like k8s/deployment.yaml. Published loopback-only; the shared lab-proxy resolves
# privilege-a2a-anthropic-demo-lab-main-1 at request time.
# The .env file (provider keys) is optional — see config.example. Without it the stack
# starts offline: heuristics mode works, model mode reports "not configured".
# `required: false` needs Docker Compose 2.24 or later.
services:
  mcp:
    build: .
    image: privilege-a2a-lab:local
    container_name: privilege-a2a-anthropic-demo-lab-mcp-1
    command: ["node", "dist/mcp-server/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      MCP_SERVER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:6883:6883"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6883/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: privilege-a2a-lab:local
    container_name: privilege-a2a-anthropic-demo-lab-worker-1
    command: ["node", "dist/worker-agent/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      WORKER_AGENT_HOST: 0.0.0.0
      MCP_URL: http://privilege-a2a-anthropic-demo-lab-mcp-1:6883/mcp
      WORKER_PUBLIC_URL: http://127.0.0.1:6882/a2a/jsonrpc
      # Only when LOCAL_GATEWAY_CA is set: trust that CA (see the volume below).
      NODE_EXTRA_CA_CERTS: ${LOCAL_GATEWAY_CA:+/certs/local-gateway-ca.pem}
    # Optional: a gateway that runs on the host. Set LOCAL_GATEWAY_HOST in .env to its hostname;
    # a name that resolves to 127.0.0.1 would otherwise mean this container itself.
    extra_hosts:
      - "${LOCAL_GATEWAY_HOST:-local-gateway.invalid}:host-gateway"
    # Optional: the CA that signed that gateway's certificate (a local mkcert root, for example).
    # Set LOCAL_GATEWAY_CA in .env to the PEM file's path on this machine; unset mounts nothing real.
    volumes:
      - ${LOCAL_GATEWAY_CA:-/dev/null}:/certs/local-gateway-ca.pem:ro
    ports:
      - "127.0.0.1:6882:6882"
    depends_on: [mcp]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6882/.well-known/agent-card.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The simulated AWS agent for the "Custodian to AWS agent" tab. Not used once AWS_AGENT_A2A_URL points at a gateway route.
  aws-agent:
    image: privilege-a2a-lab:local
    container_name: privilege-a2a-anthropic-demo-lab-aws-agent-1
    command: ["node", "dist/aws-agent-mock/index.js"]
    environment:
      AWS_MOCK_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:6885:6885"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6885/ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  main:
    image: privilege-a2a-lab:local
    container_name: privilege-a2a-anthropic-demo-lab-main-1
    command: ["node", "dist/main-agent/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      MAIN_AGENT_HOST: 0.0.0.0
      # The lab-proxy's Host for this lab (on port 6881); writes through it must carry the proxy's own Origin. Loopback always works.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-privilege-a2a.local.ping-devops.com}
      SHELF_URL: ${SHELF_URL:-https://local.ping-devops.com:8443/demo-shelf}
      WORKER_A2A_URL: ${WORKER_A2A_URL:-http://privilege-a2a-anthropic-demo-lab-worker-1:6882/a2a}
      WORKER_TRACE_URL: ${WORKER_TRACE_URL:-http://privilege-a2a-anthropic-demo-lab-worker-1:6882/trace}
      AWS_MOCK_URL: http://privilege-a2a-anthropic-demo-lab-aws-agent-1:6885/
      NODE_EXTRA_CA_CERTS: ${LOCAL_GATEWAY_CA:+/certs/local-gateway-ca.pem}
    extra_hosts:
      - "${LOCAL_GATEWAY_HOST:-local-gateway.invalid}:host-gateway"
    volumes:
      - ${LOCAL_GATEWAY_CA:-/dev/null}:/certs/local-gateway-ca.pem:ro
      # The Story wording (GET /api/story) is the repo's video/captions.md, read-only: an edit shows without rebuilding the image (the image keeps its own copy for k8s).
      - ./video/captions.md:/app/video/captions.md:ro
    ports:
      - "127.0.0.1:6881:6881"
    depends_on: [worker, aws-agent]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6881/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
