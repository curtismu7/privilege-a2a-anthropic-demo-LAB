name: Publish image

# Builds the lab image (one image: main agent, worker agent, MCP server; each container picks its
# process with `command`) and publishes it to GHCR. The SE cluster's `workeragentdemo` deployment
# pulls it. The old ghcr.io/ping-sandbox/... image is gone with that org.
# A pull request only builds (no push); a manual run from main publishes sha-<commit> and latest.
# The cluster nodes are arm64, so this builds natively on an arm64 runner.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
